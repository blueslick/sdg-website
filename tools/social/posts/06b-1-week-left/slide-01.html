<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Countdown reminder</title>
<!-- Made from the Claude Design board Reminder.dc.html. Fonts are added when the slide is drawn. -->
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #2b1518; color: #fbeee8; font-family: 'Instrument Sans Variable', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 64px 64px 52px; gap: 34px; overflow: hidden">
  <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center">
    <div class="pharos-logo" style="display: inline-flex; align-items: center; gap: 10px; height: 70px; color: #fbeee8">
  <svg viewBox="0 0 100 100" width="57" height="57" role="img" aria-label="Pharos lighthouse mark">
    <polygon points="56,22 100,6 100,40" fill="#e8705f"></polygon>
    <polygon points="44,22 0,6 0,40" fill="#e8705f" opacity="0.55"></polygon>
    <polygon points="42,19 58,19 50,8" fill="#fbeee8"></polygon>
    <rect x="44" y="19" width="12" height="11" rx="1.5" fill="#dda63a"></rect>
    <rect x="39" y="30" width="22" height="4" rx="1.5" fill="#fbeee8"></rect>
    <polygon points="43,34 57,34 62,88 38,88" fill="#fbeee8"></polygon>
    <rect x="47.5" y="46" width="5" height="9" rx="2.5" fill="#2b1518"></rect>
    <rect x="47.5" y="64" width="5" height="9" rx="2.5" fill="#2b1518"></rect>
    <rect x="30" y="88" width="40" height="7" rx="2" fill="#fbeee8"></rect>
  </svg>
  <span style="font-family: Gloock, Georgia, serif; font-size: 32px; line-height: 1; letter-spacing: 0.01em">Pharos</span>
</div>
    <span style="font-size: 26px; color: #f3c6aa; font-weight: 600">Sun 10 Jan 2027</span>
  </div>
  <div style="width: 640px; background: #fbeee8; color: #2b1518; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; align-items: center; transform: rotate(-2deg); margin-top: 24px">
    <div style="align-self: stretch; background: #e8705f; padding: 22px; display: flex; justify-content: center; gap: 120px">
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #2b1518"></span>
      <span style="width: 22px; height: 22px; border-radius: 50%; background: #2b1518"></span>
    </div>
    <span style="font-family: Gloock, Georgia, serif; font-size: 400px; line-height: 1; padding-top: 10px; font-variant-numeric: tabular-nums">7</span>
    <span style="font-size: 46px; font-weight: 700; padding-bottom: 40px; letter-spacing: 0.02em">days left to enter</span>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; margin-top: 12px">
    <span style="font-size: 38px; font-weight: 600">Entries close Sunday 17 January, 23:59 MYT</span>
    <span style="font-size: 30px; color: #f3c6aa">No extensions. Enter at pharosprize.org</span>
  </div>
</div>
