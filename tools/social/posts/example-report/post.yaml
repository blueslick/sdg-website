# EXAMPLE: a "Report or study" post (cover + 5 statistic slides).
# Everything here is invented. The report, the numbers ("XX%") and the images are
# placeholders generated by `npm run examples`. Copy this folder to start a real post.

type: report

# The big line on the cover. *Words in stars* turn terracotta.
hook: "Five numbers about hunger, *explained*"
# Optional plain-text line under the hook.
subtitle: "A placeholder example. Swap in the real report's story."

credits:
  # Required: name, publisher and year. Shown on the cover and on the last slide.
  source: { name: "The Placeholder Report on Hunger", publisher: "[Publisher]", year: 2099 }
  # Required: shown on every slide that has an image.
  image: "Pages from the report, shown for commentary."

# Exactly two short paragraphs.
caption:
  - "Placeholder caption, paragraph one: say in a sentence or two what the report found and why it matters to us."
  - "Placeholder caption, paragraph two: one clear next step, such as reading the full report or following for the Inaugural Edition."
hashtags: [ZeroHunger, SDG2, YouthVoices]

cover:
  image: cover.png
  alt: "The front page of an invented report titled The Placeholder Report on Hunger, white text on dark blue."
  crop: { x: 0, y: 20, w: 100, h: 34 }   # percent of the whole image; leave out to use all of it

# Exactly five statistic slides. box = the number to frame, in percent of the ORIGINAL image
# (get these with `npm run coords`). crop = the part of the image to show.
slides:
  - image: page-1.png
    alt: "A report page with a large blue figure reading XX.X percent."
    crop: { x: 0, y: 20, w: 70, h: 40 }
    box: { x: 7.3, y: 31.9, w: 35.8, h: 6.8 }
    comment: "Placeholder comment: say in one line what this number means."

  - image: page-2.png
    alt: "A table of invented figures. One cell reads NN.N percent."
    crop: { x: 20, y: 19, w: 75, h: 42 }
    box: { x: 61, y: 33.9, w: 9.4, h: 2 }
    comment: "Placeholder comment: the number sits inside a table, so the crop and box do the pointing."

  - image: page-3.png
    alt: "A bar chart of invented values. The tallest bar is labelled XX percent."
    crop: { x: 5, y: 24, w: 80, h: 46 }
    box: { x: 49.4, y: 32.3, w: 7.4, h: 2.1 }
    comment: "Placeholder comment: this one is a chart label."

  - image: page-4.png
    alt: "A paragraph with the phrase XX.X per cent in the middle of a sentence."
    crop: { x: 3, y: 30, w: 94, h: 14 }
    box: { x: 39.7, y: 35.5, w: 24.2, h: 2.4 }
    comment: "Placeholder comment: a number inside a sentence, boxed so nobody misses it."

  - image: page-5.png
    alt: "A shaded callout box with the figure NN million."
    crop: { x: 0, y: 42, w: 100, h: 20 }
    box: { x: 12.6, y: 48.4, w: 56.5, h: 6.8 }
    comment: "Placeholder comment: the key finding, in the report's own words."
