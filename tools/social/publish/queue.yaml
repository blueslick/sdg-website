# Instagram publishing queue.
#
# Claude adds rows here (status: draft) when it builds a post. Only Daniel changes a row to
# "approved" — by editing this file in a pull request. The publisher only ever posts rows that
# say "approved" AND have a publish_at time that has passed. It then writes back "published"
# and the Instagram post id. Nothing else gets posted, ever.
#
# status: draft -> approved -> published   (or: rejected, which is never posted)
# publish_at: Malaysia time, YYYY-MM-DD HH:MM. Dates follow the content calendar (T25).
#   A row with no publish_at is never posted, even if approved.
# folder: a post folder in tools/social/posts/

posts:
  - folder: 01-launch
    publish_at: "2026-11-16 08:00"
    status: draft
  - folder: 02-pinned-rules
    publish_at: "2026-11-16 08:05"
    status: draft
    note: "Hold until T13 (/rules/, /faq/) is merged, then point the links there"
  - folder: 03-essay-tips
    publish_at: "2026-11-16 08:10"
    status: draft
  - folder: 05-where-your-fee-goes
    publish_at: "2026-11-19 19:00"
    status: draft
  - folder: 04-fee-support
    status: draft
    note: "No slot in the calendar yet. Daniel to pick a date, or keep it as a story/highlight"
  - folder: 06a-2-weeks-left
    publish_at: "2027-01-03 19:00"
    status: draft
  - folder: 06b-1-week-left
    publish_at: "2027-01-10 19:00"
    status: draft
  - folder: 06c-3-days-left
    publish_at: "2027-01-14 19:00"
    status: draft
