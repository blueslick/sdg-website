# Copy to .github/workflows/instagram-publish.yml once the Instagram account is set up.
# Runs every hour. Posts only queue.yaml rows that Daniel marked "approved" and that are due,
# then commits the "published" status back so nothing is ever posted twice.
name: Instagram publish

on:
  schedule:
    - cron: "7 * * * *"   # hourly, 7 past (avoids the busy top of the hour)
  workflow_dispatch: {}    # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci
        working-directory: tools/social
      - run: npx playwright install chromium
        working-directory: tools/social
      # Rebuild every queued post so the images always match the latest post.yaml.
      - run: |
          for f in $(node -e "const y=require('yaml');const q=y.parse(require('fs').readFileSync('publish/queue.yaml','utf8'));console.log(q.posts.filter(p=>p.status==='approved').map(p=>p.folder).join(' '))"); do
            npm run build-post posts/$f -- --no-story --strict
          done
          node publish/publish.js prepare
        working-directory: tools/social
      # JPEGs must be on a public address for Meta to fetch: push them to the social-media branch.
      - run: |
          git config user.name "pharos-bot"
          git config user.email "pharosprize@gmail.com"
          git checkout -B social-media
          git add -f tools/social/posts/*/output/jpeg/*.jpg
          git commit -m "Media for scheduled Instagram posts" || true
          git push -f origin social-media
          git checkout -
      - run: node publish/publish.js --live
        working-directory: tools/social
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/social-media/tools/social/posts
      - run: |
          git add tools/social/publish/queue.yaml
          git commit -m "Instagram: mark published posts" || true
          git push
