# Settings for the entry-admin toolkit. Edit this file, not the Python code.
# Paths are relative to the folder this file is in.

[paths]
csv       = "tally-export.csv"   # the Tally export
files     = "downloads"         # folder of downloaded essays / proofs
tracker   = "output/tracker.xlsx"
codes     = "codes.xlsx"
templates = "../templates"
emails    = "output/emails"
judging   = "output/judging"           # judging/key.xlsx lives here: keep it PRIVATE

[entry]
id_prefix = "ZH"          # entry IDs look like ZH-001
id_digits = 3
word_limit = 800          # flag essays with MORE words than this
min_words_for_text = 20   # fewer words than this in a PDF = treated as a scan

# !! WARNING !! These two lines must match the fee options on the Tally form WORD FOR WORD
# (only capital letters and extra spaces are ignored). If you ever change the wording or the
# price of a fee option in Tally, change it here too, or EVERY entry will be flagged
# "Fee code problem: Unclear" until you do.
[fees]
full = "RM 40 (about USD 10)"
half = "Fee support at 50%: RM 20 (about USD 5)"

[codes]
length = 8                # characters per code (shown in groups)
group = 4                 # "ABCD-EFGH"

# What goes into the email drafts. Placeholders stay in [brackets] until you know them.
[email]
site_name = "Pharos"                    # keep in step with src/site.ts
edition = "Inaugural Edition (SDG 2: Zero Hunger)"
# !! This MUST match CONTACT_EMAIL in src/site.ts (the website, once PR #2 is merged).
# The address is typed in two places, so if you change one, change the other.
contact_email = "pharosprize@gmail.com"
soup_kitchen = "The Assembly Soup Kitchen (T.A.S.K)"
sign_off = "The student volunteers"

# Column mapping (the Tally form is final; these are its exact question titles): left = the name used by this toolkit (do not change),
# right = the EXACT question title in the Tally CSV. If you rename a question
# in Tally, change the right-hand side here. That is the only fix needed.
[columns]
submission_id   = "Submission ID"      # added by Tally, not a form question
respondent_id   = "Respondent ID"
submitted_at    = "Submitted at"       # added by Tally
full_name       = "Full name"
email           = "Email"
country         = "Country"
school          = "School"
age             = "Age on 17 January 2027"
prompt          = "Which prompt are you answering?"
essay           = "Your essay (PDF)"
fee             = "Your entry fee"
fee_code        = "Fee support code"
proof           = "Payment screenshot"
transfer_ref    = "Transfer reference"
payer_name      = "Name on the paying account"
declaration     = "Before you submit"
