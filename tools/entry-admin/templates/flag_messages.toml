# One sentence per flag, used in the "problem" email. Edit the wording freely.
# Keys are "flagname" or "flagname.subtype". If there is no subtype version, the plain one is used.
# Extra placeholders here: {detail} (technical detail from the tracker), {words}, {word_limit}, {max_age}.
# These go to the entrant, so don't use {detail} for the duplicate flags (it names other people's entries).

over_word_limit = "Your essay is about {words} words, and the limit is {word_limit}. (The count is taken automatically from the text in your PDF, so it may be a little off.) Please send a shorter version as a PDF."

pdf_problem = "There is a problem with the essay file we received. Please send it again as a PDF."
"pdf_problem.missing" = "We could not find an essay file with your entry. Please send your essay as a PDF."
"pdf_problem.unreadable" = "We could not open your essay file. Please send it again as a PDF."
"pdf_problem.scanned" = "Your essay PDF looks like a scan or photo, so we can't read or count the text. Please send a PDF saved or exported directly from your document (for example from Word or Google Docs)."

duplicate_entrant = "We seem to have received more than one entry with your name or email address. Please tell us which entry we should keep, or let us know if this was a mistake."

name_not_latin = "We print names on certificates in English letters, so could you send your name as you'd like it to appear in English letters? Your entry is still in."

essay_link = "We received a link in place of your essay file. The entry form asks for your essay as a PDF, so please reply with your essay attached as a PDF."

essay_unclear = "We could not tell what you sent as your essay. The entry form asks for your essay as a PDF, so please reply with your essay attached as a PDF."

age_over_limit = "The age on your entry form is over the age limit for this competition, which is {max_age} and under. If you made a mistake on the form, please tell us your correct age."
"age_over_limit.unclear" = "We could not read the age on your entry form. Please tell us your age."

"fee_code.unclear" = "We could not tell which entry fee option you chose. Please tell us whether you chose the full fee or the half fee."
"fee_code.missing" = "You chose the half-fee option but did not enter a fee support code. Please send us your code, or tell us if you meant to pay the full fee."
"fee_code.invalid" = "We could not recognise the fee support code you entered. Please check it and send it to us again."
"fee_code.used" = "The fee support code you entered has already been used. Please check you have the right code, or tell us if you meant to pay the full fee."

no_proof = "We have not received proof of your payment. Please reply with a screenshot or receipt of your payment."

duplicate_paypal = "The PayPal transaction ID you gave has already been used on another entry. Please check it and send us the correct transaction ID for your payment."
